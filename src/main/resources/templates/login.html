<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Campus Lost &amp; Found</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1   { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Sign in</h1>

  <p th:if="${param.registered}">Account created. Please sign in.</p>
  <p class="error" th:if="${param.error}">Wrong username or password.</p>
  <p th:if="${param.logout}">You have signed out.</p>

  <form th:action="@{/login}" method="post">
    <p>
      <label for="username">Username</label><br>
      <input id="username" name="username" type="text">
    </p>
    <p>
      <label for="password">Password</label><br>
      <input id="password" name="password" type="password">
    </p>
    <button type="submit">Sign in</button>
  </form>

  <p>No account yet? <a th:href="@{/register}">Register</a></p>
</body>
</html>
